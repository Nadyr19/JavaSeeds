# ==========================================
# 1. CONNEXION À LA BASE H2
# ==========================================
# Mode mémoire (données perdues à l'arrêt) - Idéal pour les tests
spring.datasource.url=jdbc:h2:mem:produitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Mode fichier (données persistées sur le disque) - Optionnel
# spring.datasource.url=jdbc:h2:file:./data/produitdb;AUTO_SERVER=TRUE

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Stratégie de création des tables :
# - create-drop : crée les tables au démarrage et les supprime à l'arrêt (parfait pour H2 mémoire)
# - create : crée les tables au démarrage mais ne les supprime pas
spring.jpa.hibernate.ddl-auto=create-drop

# Affiche les requêtes SQL générées dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. INITIALISATION DES DONNÉES (data.sql)
# ==========================================
# Active l'exécution du fichier data.sql
spring.sql.init.mode=always

# ⚠️ CRUCIAL : Force Spring à attendre qu'Hibernate ait fini de créer les tables
# avant d'exécuter data.sql (sinon erreur "Table 'PRODUITS' not found")
spring.jpa.defer-datasource-initialization=true

# Continue l'exécution même si une ligne SQL échoue (utile en dev)
spring.sql.init.continue-on-error=true

# ==========================================
# 4. CONSOLE H2 (Interface Web)
# ==========================================
# Active la console web pour visualiser et interagir avec la base
spring.h2.console.enabled=true

# Chemin d'accès à la console (accessible via http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console

# Permet l'accès à distance (désactive en production)
spring.h2.console.settings.web-allow-others=false

server.port=8081


# Configurer le chemin des ressources statiques (images)
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# Taille maximale des fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB